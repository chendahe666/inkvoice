name: InkVoice
options:
  bundleIdPrefix: org.example.inkvoice
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    INKVOICE_BUNDLE_PREFIX: org.example.inkvoice
    INKVOICE_APP_GROUP: group.org.example.inkvoice
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  InkVoice:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Info.plist, InkVoice.entitlements]
      - path: Shared
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: InkVoice
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: 开启有限语音会话时，InkVoice 持续使用麦克风；空闲音频丢弃，仅识别你主动开始的分段。
        NSSpeechRecognitionUsageDescription: InkVoice 使用 Apple 本机语音识别把你主动录入的分段转成文字；不支持本机识别时停止，不上传云端。
        InkVoiceAppGroup: $(INKVOICE_APP_GROUP)
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    entitlements:
      path: App/InkVoice.entitlements
      properties:
        com.apple.security.application-groups: [$(INKVOICE_APP_GROUP)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(INKVOICE_BUNDLE_PREFIX)
    dependencies:
      - target: InkVoiceKeyboard
        embed: true
  InkVoiceKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard
        excludes: [Info.plist, InkVoiceKeyboard.entitlements]
      - path: Shared
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: InkVoice
        InkVoiceAppGroup: $(INKVOICE_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true
    entitlements:
      path: Keyboard/InkVoiceKeyboard.entitlements
      properties:
        com.apple.security.application-groups: [$(INKVOICE_APP_GROUP)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(INKVOICE_BUNDLE_PREFIX).keyboard
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
schemes:
  InkVoice:
    build:
      targets:
        InkVoice: all
        InkVoiceKeyboard: all
    run:
      config: Debug
